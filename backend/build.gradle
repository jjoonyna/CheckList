plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.checklist'
version = '0.0.4'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.flywaydb:flyway-core:11.20.3'
    implementation 'org.flywaydb:flyway-database-postgresql:11.20.3'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testImplementation platform('io.zonky.test.postgres:embedded-postgres-binaries-bom:18.6.0')
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    def redisExecutable = System.getProperty('test.redis.executable')
    if (redisExecutable) systemProperty 'test.redis.executable', redisExecutable
}

def frontendDir = file('../frontend')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('frontendInstall', Exec) {
    workingDir frontendDir
    commandLine npmCommand, 'ci'
    inputs.files(new File(frontendDir, 'package.json'), new File(frontendDir, 'package-lock.json'))
    outputs.dir(new File(frontendDir, 'node_modules'))
}

tasks.register('frontendBuild', Exec) {
    dependsOn 'frontendInstall'
    workingDir frontendDir
    commandLine npmCommand, 'run', 'build'
    inputs.files(fileTree(frontendDir) { exclude 'node_modules/**', 'dist/**' })
    outputs.dir(new File(frontendDir, 'dist'))
}

tasks.named('processResources') {
    dependsOn 'frontendBuild'
    from(new File(frontendDir, 'dist')) { into 'static' }
}
