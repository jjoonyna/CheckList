name: PR 통합 후 빌드

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  test-and-jar:
    name: 테스트와 통합 JAR
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 통합 결과 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Java 21 준비
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/build.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Node.js 22 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 테스트용 Redis 실행 파일 준비
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: 프론트 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 프론트 테스트
        working-directory: frontend
        run: npm run test -- --run
      - name: 백엔드 테스트와 통합 빌드
        working-directory: backend
        run: bash ./gradlew test bootJar --no-daemon --console=plain --max-workers=2
      - name: 통합 JAR 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checklist-jar
          path: backend/build/libs/checklist-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
      - name: 백엔드 테스트 보고서 업로드
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checklist-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          if-no-files-found: warn
          retention-days: 14

  windows-installer:
    name: Windows 설치 EXE
    needs: test-and-jar
    if: github.event.pull_request.merged == true
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: 통합 결과 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Java 21 준비
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: 검증한 JAR 다운로드
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checklist-jar
          path: backend/build/libs
      - name: 설치 EXE 생성
        shell: pwsh
        run: ./scripts/package-deploy.ps1 -Java21 (Join-Path $env:JAVA_HOME 'bin/java.exe') -SkipBuild -CompileInstaller
      - name: 설치 EXE 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checklist-windows-installer
          path: dist/checklist-setup-0.1.0.exe
          if-no-files-found: error
          retention-days: 14