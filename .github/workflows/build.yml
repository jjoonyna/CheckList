name: 체크리스트 빌드 및 릴리즈

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  test-and-jar:
    name: 테스트와 통합 JAR
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 통합 결과 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Java 21 준비
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/build.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Node.js 22 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 릴리즈 규칙 테스트
        run: node --test scripts/release.test.mjs
      - name: CHANGELOG와 버전 검증
        id: release
        run: node scripts/release.mjs
      - name: 테스트용 Redis 실행 파일 준비
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: 프론트 의존성 설치
        working-directory: frontend
        run: npm ci
      - name: 프론트 테스트
        working-directory: frontend
        run: npm run test -- --run
      - name: 백엔드 테스트와 통합 빌드
        working-directory: backend
        run: bash ./gradlew test bootJar --no-daemon --console=plain --max-workers=2
      - name: 통합 JAR 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checklist-jar
          path: backend/build/libs/checklist-${{ steps.release.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 14
      - name: 백엔드 테스트 보고서 업로드
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checklist-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          if-no-files-found: warn
          retention-days: 14

  packaging-tests:
    name: 패키징 진단 테스트
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: PowerShell 7 진단 테스트
        shell: pwsh
        run: |
          ./scripts/package-support.test.ps1
          ./scripts/package-licenses.test.ps1
          ./scripts/package-postgres.test.ps1
          ./scripts/install-config.test.ps1
          ./scripts/installer-flow.test.ps1
      - name: Windows PowerShell 진단 테스트
        shell: powershell
        run: |
          ./scripts/package-support.test.ps1
          ./scripts/package-licenses.test.ps1
          ./scripts/package-postgres.test.ps1
          ./scripts/install-config.test.ps1
          ./scripts/installer-flow.test.ps1

  windows-installer:
    name: Windows 설치 EXE
    needs: [test-and-jar, packaging-tests]
    if: github.event.pull_request.merged == true
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: 통합 결과 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
      - name: Java 21 준비
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: 검증한 JAR 다운로드
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checklist-jar
          path: backend/build/libs
      - name: 설치 EXE 생성
        shell: pwsh
        run: ./scripts/package-deploy.ps1 -Java21 (Join-Path $env:JAVA_HOME 'bin/java.exe') -SkipBuild -CompileInstaller -Version '${{ needs.test-and-jar.outputs.version }}'
      - name: 실제 PostgreSQL 초기화 권한 검사
        shell: powershell
        run: |
          $initdb = Get-ChildItem build -Directory -Filter 'deploy-stage-*' | Sort-Object LastWriteTime -Descending | ForEach-Object { Join-Path $_.FullName 'postgresql/bin/initdb.exe' } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$initdb) { throw '번들 PostgreSQL을 찾지 못했습니다.' }
          ./scripts/postgres-permissions.test.ps1 -Initdb $initdb
      - name: 실제 설치·실패 처리·구성요소 제거 검사
        shell: powershell
        run: |
          ./scripts/install-log-access.test.ps1
          ./scripts/installer-encoding.test.ps1 -Compiler (Join-Path $PWD 'tools-cache/deploy/inno-6.7.3/ISCC.exe')
          ./scripts/installer-mode.test.ps1 -Compiler (Join-Path $PWD 'tools-cache/deploy/inno-6.7.3/ISCC.exe')
          $stage = Get-ChildItem build -Directory -Filter 'deploy-stage-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          ./scripts/reinstall.test.ps1 -JavaHome $env:JAVA_HOME -JreHome (Join-Path $stage.FullName 'jre') -WinSW (Join-Path $PWD 'tools-cache/deploy/WinSW-2.12.0.exe')
          ./scripts/uninstaller.test.ps1 -Compiler (Join-Path $PWD 'tools-cache/deploy/inno-6.7.3/ISCC.exe') -WinSW (Join-Path $PWD 'tools-cache/deploy/WinSW-2.12.0.exe')
      - name: 실제 Redis 번들 실행 검사
        shell: pwsh
        run: |
          $server = Get-ChildItem build -Directory -Filter 'deploy-stage-*' | Sort-Object LastWriteTime -Descending | ForEach-Object { Join-Path $_.FullName 'redis/redis-server.exe' } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$server) { throw '번들 Redis를 찾지 못했습니다.' }
          ./scripts/redis-bundle.test.ps1 -ServerPath $server
      - name: 패키징 진단 로그 업로드
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checklist-packaging-logs
          path: |
            tools-cache/deploy/logs/**
            build/installer-test-logs/**
            build/installer mode */*.log
          if-no-files-found: warn
          retention-days: 14
      - name: 설치 EXE 업로드
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: checklist-windows-installer
          path: dist/checklist-setup-${{ needs.test-and-jar.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 14
  release:
    name: CHANGELOG 기반 릴리즈 게시
    needs: [test-and-jar, windows-installer]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: checklist-release
      cancel-in-progress: false
    steps:
      - name: 통합 결과 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Node.js 22 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: 검증한 JAR 다운로드
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checklist-jar
          path: backend/build/libs
      - name: 검증한 설치 EXE 다운로드
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checklist-windows-installer
          path: dist
      - name: CHANGELOG 노트와 JAR·EXE 릴리즈 게시
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node scripts/release.mjs --publish
