services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:-checklist}
      POSTGRES_USER: ${DB_USERNAME:-checklist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 지정하세요}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-checklist} -d ${DB_NAME:-checklist}"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD를 .env에 지정하세요}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-checklist}
      DB_USERNAME: ${DB_USERNAME:-checklist}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 지정하세요}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD를 .env에 지정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET를 .env에 지정하세요}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8383
      FILE_DIRECTORY: /app/data/attachments
    ports:
      - "${APP_PORT:-8383}:8383"
    volumes:
      - app-data:/app/data
volumes:
  postgres-data:
  app-data:
